<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A9 - Productivity Dashboard | Task Hub</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f8fb;
        color: #17202a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0; }
      a { color: inherit; text-decoration: none; }
      .back { color: #116466; font-weight: 800; }
      h1 { margin: 26px 0 10px; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; letter-spacing: 0; }
      p { max-width: 680px; margin: 0 0 28px; color: #5d6673; line-height: 1.6; }
      .designs { display: grid; gap: 12px; }
      .design-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px;
        border: 1px solid #dde3ea;
        border-radius: 8px;
        background: #ffffff;
      }
      .design-link span { min-width: 0; overflow-wrap: anywhere; font-weight: 800; }
      .design-link strong { color: #116466; }
      @media (max-width: 560px) {
        .design-link { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/">Back to hub</a>
      <h1>A9 - Productivity Dashboard</h1>
      <p>Single-page productivity dashboard with local storage and fetch API.</p>
      <section class="designs" aria-label="Designs">
          <a class="design-link" href="./dashboard/">
            <span>Dashboard</span>
            <strong>Open</strong>
          </a>
      </section>
    </main>
  </body>
</html>
