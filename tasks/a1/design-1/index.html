<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Pokemon Pikachu Card</title>
  </head>
  <body>
    <section class="main-container">
      <div class="left-section">
        <div class="logo">
          <img
            class="logo-img"
            src="./assests/pokemon_logo.png"
            alt="Pokemon Logo"
          />
        </div>

        <div class="left-content">
          <div class="sub-heading">POKEMON GEN I</div>
          <div class="heading">Pikachu</div>
          <div class="content">
            Pikachu is an Electric-type Pokemon introduced in Generation I.
            Pikachu are small, chubby, and incredibly cute mouse-like Pokemon.
            They are almost completely covered by yellow fur.
          </div>
          <div class="counter"><span></span>01 / 08</div>
        </div>

        <img
          class="watermark"
          src="./assests/pokeball_watermark.png"
          alt="Pokeball watermark"
        />
      </div>

      <div class="right-section">
        <div class="menu">
          <i class="ri-menu-line"></i>
        </div>

        <div class="slider-dots" aria-label="Pokemon slide navigation">
          <span class="active"></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="hero-img">
        <img src="./assests/pikachu-hero-img.png" alt="Pikachu" />
      </div>
    </section>
  </body>
</html>
