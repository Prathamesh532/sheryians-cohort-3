  <div class="gallery-container">

          <img src="assets/monocular.jpg" alt="Monocular">
        </div>
        <div class="card-info">
          <h3>Monocular</h3>
          <div class="likes">
            <span>54.8k</span>
            <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78v0z"/></svg>

        </div>

      </div>
