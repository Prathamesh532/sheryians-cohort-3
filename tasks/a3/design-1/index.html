<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A3 - Squid Game</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="bg-gradient"></div>
  
  <!-- Faint Background Texts -->
  <div class="bg-text-bottom">GAME</div>
  <div class="bg-text-right">SQUID</div>

  <nav class="navbar">
    <div class="logo-small">
      <div style="font-weight: 900; font-size: 16px; line-height: 1; letter-spacing: 2px;">SQUID<br>GAME</div>
      <div class="pink-line-small"></div>
    </div>
    
    <ul class="nav-links">
      <li><a href="#">About</a></li>
      <li><a href="#" class="active">Watch now</a></li>
      <li><a href="#">Actors</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    
    <div class="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <main>
    <div class="left-col">
      <div class="huge-logo" style="margin-bottom: 30px;">
        <div style="font-size: 80px; font-weight: 900; line-height: 0.8; letter-spacing: 5px; color: transparent; -webkit-text-stroke: 2px #fff;">SQUID</div>
        <div style="font-size: 80px; font-weight: 900; line-height: 0.8; position: relative; display: inline-block;">
          GAME
          <div style="position: absolute; top: 50%; right: -30px; width: 60px; height: 6px; background: #e91a63;"></div>
        </div>
      </div>
      
      <p class="desc">
        Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br>
        Season 1: 9 Episodes
      </p>
      
      <div class="buttons">
        <button class="btn-primary">
          <div class="play-circle">
            <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M8 5v14l11-7z"/></svg>
          </div>
          Play Now
        </button>
        <button class="btn-secondary">
          <div class="play-icon-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>
          </div>
          Watch Trailer
        </button>
      </div>
    </div>

    <div class="center-col">
      <div class="scroll-wrapper">
        <span class="scroll-text">SCROLL</span>
        <div class="scroll-line"></div>
      </div>
    </div>

    <div class="right-col">
      <div class="hero-image-wrapper">
        <img src="assets/guard-hero.png" alt="Guard" class="hero-guard">
      </div>
      
      <div class="socials">
        <!-- SVG Icons for Twitter, Instagram, Facebook -->
        <a href="#"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path></svg></a>
        <a href="#"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a>
        <a href="#"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg></a>
      </div>
    </div>
  </main>

  <div class="footer-section">
    <div class="thumbnails-glass">
      <div class="thumb active">
        <img src="assets/thumb-1.jpg" alt="Guard Circle">
        <div class="thumb-play">
          <svg viewBox="0 0 24 24" fill="white" width="10" height="10"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="thumb">
        <div class="overlay"></div>
        <img src="assets/thumb-2.jpg" alt="Gas Mask">
        <div class="thumb-play">
          <svg viewBox="0 0 24 24" fill="white" width="10" height="10"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="thumb">
        <div class="overlay"></div>
        <img src="assets/thumb-3.jpg" alt="Group">
        <div class="thumb-play">
          <svg viewBox="0 0 24 24" fill="white" width="10" height="10"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
