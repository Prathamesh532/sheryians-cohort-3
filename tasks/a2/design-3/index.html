<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insect Specimen</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="specimen-page">
      <section class="left-panel">
        <header class="left-nav">
          <div class="brand">INSECT</div>
          <label class="search">
            <span>O</span>
            <input type="text" placeholder="Search..." />
          </label>
        </header>

        <div class="classification-title">Classification</div>

        <div class="classification-list">
          <div class="item"><i></i><strong>Class:</strong><span>Insecta</span></div>
          <div class="item"><i></i><strong>Order:</strong><span>Coleoptera</span></div>
          <div class="item"><i></i><strong>Family:</strong><span>Cerambycidae</span></div>
          <div class="item"><i></i><strong>Sub-Family:</strong><span>Cerambycinae</span></div>
          <div class="item"><i></i><strong>Tribe:</strong><span>Callichromatini</span></div>
          <div class="item"><i></i><strong>Genus:</strong><span>Pachyteria</span></div>
        </div>
      </section>

      <section class="right-panel">
        <nav class="menu">
          <a href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">About</a>
          <a href="#">Gallery</a>
          <a href="#">Contact</a>
        </nav>

        <div class="product-info">
          <h1>Pachyteria<br />equestris</h1>
          <div class="details">
            <div class="bug-icon">
              <span class="bug-shape"></span>
              <small>32 mm</small>
            </div>
            <div class="detail-list">
              <div><b>PIN</b><span><strong>Locality:</strong> Malaysia</span></div>
              <div><b>M</b><span><strong>Sex:</strong> Male</span></div>
              <div><b>MM</b><span><strong>Size:</strong> 32 mm / 12 mm</span></div>
            </div>
          </div>
          <div class="price">$5.99</div>
          <label class="toggle"><input type="checkbox" /> <span></span> View detailed antennae</label>
          <label class="toggle"><input type="checkbox" /> <span></span> View underside</label>
          <button>Add to collection</button>
        </div>
      </section>

      <img class="specimen" src="./assests/specimen-dome.png" alt="Pachyteria equestris specimen in glass dome" />
    </main>
  </body>
</html>
